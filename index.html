<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Course Portal</title>
<style>
body{font-family:Arial;margin:0;background:#eef2f7}
header{background:#1f2a44;color:white;padding:18px;text-align:center}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
button{padding:10px 16px;border:none;border-radius:6px;background:#2e7df6;color:white;font-size:14px;cursor:pointer}
button:hover{background:#1d5fd1}
input,textarea,select{width:100%;padding:8px;margin-top:6px;margin-bottom:12px}
.correct{color:green;font-weight:bold}
.wrong{color:red;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h2>English Homework Platform</h2>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login" class="card">
<h3>Select your user</h3>
<select id="userSelect">
<option>Jonathan Rodríguez</option>
<option>Uzziel García</option>
<option>Admin</option>
</select>

<div id="adminPassword" class="hidden">
<label>Admin password</label>
<input type="password" id="password">
</div>

<button onclick="loginUser()">Enter</button>
<p id="loginMsg"></p>
</div>

<!-- MENU -->
<div id="menu" class="card hidden">
<h3>Sections</h3>
<button onclick="openSection('reading')">Reading</button>
<button onclick="openSection('listening')">Listening</button>
<button onclick="openSection('writing')">Writing</button>
<button id="adminBtn" class="hidden" onclick="toggleAdmin()">Admin Panel</button>
</div>

<!-- SECTION CONTENT -->
<div id="activitySection" class="card hidden"></div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="card hidden">
<h3>Create Activity</h3>

<label>Section</label>
<select id="sectionType">
<option value="reading">Reading</option>
<option value="listening">Listening</option>
<option value="writing">Writing</option>
</select>

<label>Instructions / Question</label>
<textarea id="question"></textarea>

<label>Audio URL (optional for listening)</label>
<input id="audio">

<label>Answer type</label>
<select id="type">
<option value="text">Text</option>
<option value="mc">Multiple Choice</option>
</select>

<label>Options (comma separated)</label>
<input id="options">

<label>Correct Answer</label>
<input id="correct">

<label>Hint</label>
<input id="hint">

<button onclick="addActivity()">Add Activity</button>

<h3>Student Results</h3>
<div id="results"></div>
</div>

</div>

<script>
let currentUser=""
let attempts={}

let activities=JSON.parse(localStorage.getItem("activities")||"{reading:[],listening:[],writing:[]}")
let results=JSON.parse(localStorage.getItem("results")||"[]")

userSelect.addEventListener("change",()=>{
if(userSelect.value==="Admin") adminPassword.classList.remove("hidden")
else adminPassword.classList.add("hidden")
})

function loginUser(){
let user=userSelect.value

if(user==="Admin" && password.value!=="VFM31122002"){
loginMsg.innerText="Wrong password"
return
}

currentUser=user

document.getElementById("login").classList.add("hidden")
menu.classList.remove("hidden")

if(user==="Admin"){
adminBtn.classList.remove("hidden")
showResults()
}
}

function openSection(section){
activitySection.innerHTML=""
activitySection.classList.remove("hidden")

let list=activities[section]

list.forEach((q,i)=>{
let div=document.createElement("div")
div.className="card"

let html=`<p><b>${q.question}</b></p>`

if(q.audio){
html+=`<audio controls src="${q.audio}"></audio><br><br>`
}

if(q.type==="text"){
html+=`<input id="ans${i}">`
}else{
q.options.split(",").forEach(o=>{
html+=`<label><input type='radio' name='ans${i}' value='${o}'> ${o}</label><br>`
})
}

html+=`<button onclick="checkAnswer('${section}',${i})">Submit</button>
<p id="msg${i}"></p>`

div.innerHTML=html
activitySection.appendChild(div)

attempts[i]=0
})

activitySection.innerHTML+=`<button onclick="sendResults('${section}')">Send Results</button>`
}

function checkAnswer(section,i){
let q=activities[section][i]
attempts[i]++
let value

if(q.type==="text") value=document.getElementById(`ans${i}`).value
else value=document.querySelector(`input[name='ans${i}']:checked`)?.value

let msg=document.getElementById(`msg${i}`)

if(value===q.correct){
msg.innerHTML="<span class='correct'>Correct</span>"
}else{
if(attempts[i]==1){
msg.innerHTML=`<span class='wrong'>Incorrect. Hint: ${q.hint}</span>`
}else{
msg.innerHTML="<span class='wrong'>Incorrect. No more attempts.</span>"
}
}
}

function sendResults(section){
let total=activities[section].length
let correct=0

for(let i=0;i<total;i++){
let msg=document.getElementById(`msg${i}`)
if(msg && msg.innerText.includes("Correct")) correct++
}

let score=Math.round((correct/total)*100)

results.push({user:currentUser,section,score,date:new Date().toLocaleString()})
localStorage.setItem("results",JSON.stringify(results))

let message=""

if(score>=70){
if(currentUser==="Jonathan Rodríguez") message="Congratulations. Jonathan"
if(currentUser==="Uzziel García") message="Congratulations. Uzziel"
}else{
let msgs=[
"Keep practicing, you can do it!",
"Don't give up, improvement comes with practice!",
"Nice try! Review the material and try again next time!"
]
message=msgs[Math.floor(Math.random()*msgs.length)]
}

alert(`Score: ${score}% \n${message}`)
}

function toggleAdmin(){
adminPanel.classList.toggle("hidden")
showResults()
}

function addActivity(){
let section=sectionType.value

let obj={
question:question.value,
audio:audio.value,
type:type.value,
options:options.value,
correct:correct.value,
hint:hint.value
}

activities[section].push(obj)
localStorage.setItem("activities",JSON.stringify(activities))

alert("Activity added successfully")
}

function showResults(){
let container=document.getElementById("results")
container.innerHTML=""

results.forEach(r=>{
container.innerHTML+=`<p>${r.user} | ${r.section} | ${r.score}% | ${r.date}</p>`
})
}
</script>

</body>
</html>
