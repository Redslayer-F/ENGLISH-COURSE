<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Course Classroom</title>
<style>
body{font-family:Arial;margin:0;background:#eef3fb}
header{background:#0f1f3d;color:white;padding:18px;text-align:center}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
button{background:#2e7df6;color:white;border:none;padding:10px 16px;border-radius:6px;cursor:pointer}
button:hover{background:#1c5ed1}
input,textarea,select{width:100%;padding:8px;margin-top:6px;margin-bottom:12px}
.hidden{display:none}
.correct{color:green;font-weight:bold}
.wrong{color:red;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.score{font-size:20px;font-weight:bold}
.sectionTitle{font-size:20px;margin-bottom:10px}
</style>
</head>
<body>

<header>
<h2>B2 English Course HW</h2>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login">
<h2>Login</h2>

<select id="userSelect">
<option>Jonathan Rodríguez</option>
<option>Uzziel García</option>
<option>Admin</option>
</select>

<br><br>

<div id="adminPassword" class="hidden">
<label>Admin Password</label>
<br>
<input type="password" id="password">
</div>

<br>

<button onclick="loginUser()">Login</button>

<p id="loginMsg"></p>
</div>

<!-- MENU -->
<div id="menu" class="card hidden">
<h3>Course Sections</h3>

<div class="grid">
<button onclick="openSection('reading')">📖 Reading</button>
<button onclick="openSection('listening')">🎧 Listening</button>
<button onclick="openSection('writing')">✍️ Writing</button>
</div>

<br>

<button onclick="showProgress()">📊 My Progress</button>
<button id="adminBtn" class="hidden" onclick="toggleAdmin()">👨‍🏫 Admin Panel</button>
<button onclick="logout()">Logout</button>
</div>

<!-- ACTIVITY AREA -->
<div id="activitySection" class="card hidden"></div>

<!-- PROGRESS -->
<div id="progressPanel" class="card hidden">
<h3>My Results</h3>
<div id="progressResults"></div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="card hidden">
<h3>Create Activity</h3>

<label>Section</label>
<select id="sectionType">
<option value="reading">Reading</option>
<option value="listening">Listening</option>
<option value="writing">Writing</option>
</select>

<label>Reading Text</label>
<textarea id="readingText"></textarea>

<label>Question</label>
<textarea id="question"></textarea>

<label>Audio URL (optional)</label>
<input id="audio">

<label>Answer Type</label>
<select id="type">
<option value="text">Text</option>
<option value="mc">Multiple Choice</option>
</select>

<label>Options (comma separated)</label>
<input id="options">

<label>Correct Answer</label>
<input id="correct">

<label>Hint</label>
<input id="hint">

<button onclick="addActivity()">Add Activity</button>

<hr>

<h3>All Student Results</h3>
<div id="adminResults"></div>
</div>

</div>


<script>

let currentUser=""

// show password only when Admin is selected
const userSelect=document.getElementById("userSelect")
const adminPassword=document.getElementById("adminPassword")

userSelect.addEventListener("change",function(){

if(userSelect.value==="Admin"){
adminPassword.classList.remove("hidden")
}else{
adminPassword.classList.add("hidden")
}

})


function loginUser(){

let user=document.getElementById("userSelect").value
let password=document.getElementById("password").value
let msg=document.getElementById("loginMsg")

msg.innerText=""

if(user==="Admin"){

if(password!=="VFM31122002"){
msg.innerText="Wrong password"
return
}

}

currentUser=user

// hide login

document.getElementById("login").classList.add("hidden")

// show menu

document.getElementById("menu").classList.remove("hidden")

// show admin button if admin

if(user==="Admin"){
let btn=document.getElementById("adminBtn")
btn.classList.remove("hidden")
}

}

function logout(){
location.reload()
}


// OPEN SECTION

function openSection(section){

let container=document.getElementById("activitySection")
container.innerHTML=""
container.classList.remove("hidden")

let list=activities[section]

if(list.length===0){
container.innerHTML="<p>No activities yet.</p>"
return
}

list.forEach(function(q,i){

let div=document.createElement("div")
div.className="card"

let html=""

if(q.readingText){
html+=`<p>${q.readingText}</p><hr>`
}

html+=`<p class='sectionTitle'><b>${q.question}</b></p>`

if(q.audio){
html+=`<audio controls src="${q.audio}"></audio><br><br>`
}

if(q.type==="text"){
html+=`<textarea id="ans${i}"></textarea>`
}
else{

q.options.split(",").forEach(function(opt){
html+=`<label><input type='radio' name='ans${i}' value='${opt}'> ${opt}</label><br>`
})

}

html+=`<button onclick="checkAnswer('${section}',${i})">Submit</button>
<p id="msg${i}"></p>`


div.innerHTML=html
container.appendChild(div)

attempts[i]=0

})

container.innerHTML+=`<button onclick="sendResults('${section}')">Send Results</button>`

}

// CHECK ANSWER

function checkAnswer(section,i){

let q=activities[section][i]

attempts[i]++

let value=""

if(q.type==="text"){
value=document.getElementById("ans"+i).value
}
else{

let selected=document.querySelector("input[name='ans"+i+"']:checked")
if(selected){
value=selected.value
}

}

let msg=document.getElementById("msg"+i)

if(value===q.correct){
msg.innerHTML="<span class='correct'>Correct</span>"
}
else{

if(attempts[i]==1){
msg.innerHTML="<span class='wrong'>Incorrect. Hint: "+q.hint+"</span>"
}
else{
msg.innerHTML="<span class='wrong'>Incorrect. No more attempts.</span>"
}

}

}

// SEND RESULTS

function sendResults(section){

let total=activities[section].length
let correct=0

for(let i=0;i<total;i++){

let msg=document.getElementById("msg"+i)

if(msg && msg.innerText.includes("Correct")){
correct++
}

}

let score=Math.round((correct/total)*100)

results.push({user:currentUser,section:section,score:score,date:new Date().toLocaleString()})

localStorage.setItem("results",JSON.stringify(results))

let message=""

if(score>=70){

if(currentUser==="Jonathan Rodríguez"){
message="Congratulations. Jonathan"
}

if(currentUser==="Uzziel García"){
message="Congratulations. Uzziel"
}

}
else{

let msgs=[
"Keep practicing. You're improving!",
"Don't give up. Practice makes progress.",
"Review the lesson and try again next time."
]

message=msgs[Math.floor(Math.random()*msgs.length)]

}

alert("Score: "+score+"% \n"+message)

}

// STUDENT PROGRESS

function showProgress(){

let panel=document.getElementById("progressPanel")
panel.classList.remove("hidden")

let div=document.getElementById("progressResults")

let myResults=results.filter(r=>r.user===currentUser)

let html=""

myResults.forEach(function(r){
html+=`<p>${r.section} | ${r.score}% | ${r.date}</p>`
})

if(html===""){
html="<p>No results yet.</p>"
}


div.innerHTML=html

}

// ADMIN PANEL

function toggleAdmin(){

let panel=document.getElementById("adminPanel")

if(panel.classList.contains("hidden")){
panel.classList.remove("hidden")
}
else{
panel.classList.add("hidden")
}

showAdminResults()

}

function addActivity(){

let section=document.getElementById("sectionType").value

let obj={

readingText:document.getElementById("readingText").value,
question:document.getElementById("question").value,
audio:document.getElementById("audio").value,
type:document.getElementById("type").value,
options:document.getElementById("options").value,
correct:document.getElementById("correct").value,
hint:document.getElementById("hint").value

}

activities[section].push(obj)

localStorage.setItem("activities",JSON.stringify(activities))

alert("Activity added")

}

// ADMIN RESULTS

function showAdminResults(){

let div=document.getElementById("adminResults")

let html=""

results.forEach(function(r){

html+=`<p>${r.user} | ${r.section} | ${r.score}% | ${r.date}</p>`

})

if(html===""){
html="<p>No results yet.</p>"
}


div.innerHTML=html

}

</script>

</body>
</html>
